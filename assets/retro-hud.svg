<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Player status HUD: online, building and exploring" shape-rendering="crispEdges"><title>Player status HUD: online, building and exploring</title><defs><pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".22"/></pattern><style>.tw{animation:tw 3s steps(2) infinite}@keyframes tw{50%{opacity:.15}}</style></defs><rect x="0" y="4" width="1200" height="56" fill="#FF8C42" /><rect x="4" y="0" width="1192" height="64" fill="#FF8C42" /><rect x="4" y="8" width="1192" height="48" fill="#111827" /><rect x="8" y="4" width="1184" height="56" fill="#111827" /><rect x="24" y="24" width="12" height="12" fill="#7CDBA6" class="tw"/><text x="48" y="36" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#FFD166" text-anchor="start" shape-rendering="auto" >PLAYER STATUS</text><text x="210" y="36" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#7CDBA6" text-anchor="start" shape-rendering="auto" >● ONLINE</text><text x="330" y="36" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#E8E6DD" text-anchor="start" shape-rendering="auto" >CURRENT MISSION: BUILDING &amp; EXPLORING</text><text x="1168" y="36" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="bold" fill="#FF8C42" text-anchor="end" shape-rendering="auto" >FRONTIER: OPEN</text><rect width="1200" height="64" fill="url(#sl)"/></svg>